name: clients

on:
  push:
    branches: [main]
    tags: ["clients-v*"]
    paths: ["clients/**", "api/**", ".github/workflows/clients.yml"]
  pull_request:
    paths: ["clients/**", "api/**", ".github/workflows/clients.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" > /dev/null
      - name: Tests (shared code on JVM, Room in-memory, contract + fixtures)
        run: ./gradlew :core:model:desktopTest :app:desktopTest --continue
      - name: Build Android debug + desktop
        run: ./gradlew :androidApp:assembleDebug :desktopApp:createDistributable
      - name: Room schemas are committed
        run: git diff --exit-code -- app/schemas || (echo "::error::Room schema changed – commit clients/app/schemas." && exit 1)

  release-android:
    if: startsWith(github.ref, 'refs/tags/clients-v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" > /dev/null
      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#clients-v}"
          IFS=. read -r major minor patch <<< "${v%%-*}"
          # versionCode grows with the semantic version: 1.4.2 → 1004002
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))" >> "$GITHUB_OUTPUT"
      - name: Keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.NOTES_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK (R8)
        env:
          NOTES_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NOTES_KEYSTORE_PASSWORD: ${{ secrets.NOTES_KEYSTORE_PASSWORD }}
          NOTES_KEY_ALIAS: ${{ secrets.NOTES_KEY_ALIAS }}
          NOTES_KEY_PASSWORD: ${{ secrets.NOTES_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -Pnotes.versionName=${{ steps.version.outputs.name }} -Pnotes.versionCode=${{ steps.version.outputs.code }}
      - name: Verify signature
        run: '"$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs androidApp/build/outputs/apk/release/notes-*.apk'
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" androidApp/build/outputs/apk/release/notes-*.apk --title "Notes ${{ steps.version.outputs.name }} (Android)" --generate-notes
