name: server

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
    paths: ["VERSION", "server/**", "api/**", "Dockerfile", ".dockerignore", "scripts/check-api-compat.sh", ".github/workflows/server.yml"]
  pull_request:
    paths: ["VERSION", "server/**", "api/**", "Dockerfile", ".dockerignore", "scripts/check-api-compat.sh", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - name: Build
        working-directory: server
        run: dotnet build -c Release
      - name: api/openapi.json is up to date
        run: git diff --exit-code -- api/openapi.json || (echo "::error::api/openapi.json changed on build – rebuild Notes.Server locally and commit it." && exit 1)
      - name: Test
        working-directory: server
        run: dotnet test -c Release --no-build

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No breaking API changes, published fixtures unchanged
        run: scripts/check-api-compat.sh

  image:
    needs: [test, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notes
          tags: |
            type=match,pattern=v(\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
      - name: Version
        id: version
        run: |
          v=$(cat VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$v" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"; exit 1; }
            echo "value=$v" >> "$GITHUB_OUTPUT"
          else
            echo "value=$v-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
