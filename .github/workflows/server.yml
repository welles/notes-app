name: server

on:
  push:
    branches: [main]
    paths: ["VERSION", "server/**", "api/**", "Dockerfile", ".dockerignore", "scripts/check-api-compat.sh", ".github/workflows/server.yml"]
  pull_request:
    paths: ["VERSION", "server/**", "api/**", "Dockerfile", ".dockerignore", "scripts/check-api-compat.sh", ".github/workflows/server.yml"]
  workflow_dispatch:
  # From release.yml: tests the commit to be released
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: server/global.json
      - name: Build
        working-directory: server
        run: dotnet build -c Release
      - name: api/openapi.json is up to date
        run: git diff --exit-code -- api/openapi.json || (echo "::error::api/openapi.json changed on build – rebuild Notes.Server locally and commit it." && exit 1)
      - name: Test
        working-directory: server
        run: dotnet test -c Release --no-build

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No breaking API changes, published fixtures unchanged
        run: scripts/check-api-compat.sh

  # Builds the image only; release.yml pushes it
  image:
    needs: [test, compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=0-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
